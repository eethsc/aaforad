services:
  fusion:
    build:
      context: .
    ports:
      - "${PORT:-4174}:4174"
    environment:
      PORT: 4174
      FUSION_REQUIRE_LLM: "${FUSION_REQUIRE_LLM:-true}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openrouter/auto}"
      FUSION_SIMULATOR: ngspice
      FUSION_PDF_ENGINE: "${FUSION_PDF_ENGINE:-opendataloader}"
      PDK_ROOT: /opt/pdks
      PDK: sky130A
      PDK_MODEL_FILE: /opt/pdks/sky130A/libs.tech/ngspice/sky130.lib.spice
      SKY130_PDK_VERSION: "${SKY130_PDK_VERSION:-b344c97eacc2aaf8e14ae7e43e2e9dc0871de2c0}"
    volumes:
      - sky130-pdk:/opt/pdks

volumes:
  sky130-pdk:
